[tool.poetry]
name = "py-online-cinema-fastapi"
version = "1.0.0"
description = "REST API backend for an online cinema platform"
authors = ["shafran <andrii.shafran@namecheap.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "0.111.0"
uvicorn = {version = "0.29.0", extras = ["standard"]}

# Database
SQLAlchemy = "2.0.30"
asyncpg = "0.31.0"
aiosqlite = "0.20.0"
alembic = "1.13.1"
psycopg2-binary = "2.9.9"

# Validation & Settings
pydantic = "2.13.4"
pydantic-settings = "2.3.0"
email-validator = "2.1.1"

# Authentication / Security
python-jose = {version = "3.3.0", extras = ["cryptography"]}
passlib = {version = "1.7.4", extras = ["bcrypt"]}
bcrypt = "4.0.1"
python-multipart = "0.0.9"

# Email
aiosmtplib = "3.0.1"
jinja2 = "3.1.4"

# Storage (S3 / MinIO)
boto3 = "1.34.131"

# Payments
stripe = "5.5.0"

# Background tasks
celery = "5.3.6"
redis = "5.0.6"

# Async utilities
anyio = "4.4.0"

# Utilities
python-dotenv = "1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.7"
httpx = "0.27.0"
flake8 = "*"
mypy = "*"
types-passlib = "*"
types-redis = "*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
